<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#20243C"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#9091DF" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.2">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Brain Slice Abstract Outline -->
  <path d="M 220 250 C 220 150, 300 90, 400 90 C 500 90, 580 150, 580 250 C 580 340, 520 400, 400 400 C 300 400, 220 340, 220 250 Z" stroke="#A0A1F8" stroke-width="2" fill="none" opacity="0.6"/>
  
  <path d="M 260 250 C 260 180, 320 130, 400 130 C 480 130, 540 180, 540 250 C 540 310, 480 370, 400 370 C 320 370, 260 310, 260 250 Z" stroke="#B6BAFA" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.5"/>

  <!-- Brainstem Target ROI (PULSE T1w) -->
  <ellipse cx="400" cy="330" rx="35" ry="45" fill="#A0A1F8" fill-opacity="0.25" stroke="#A0A1F8" stroke-width="2"/>
  <circle cx="400" cy="330" r="12" fill="#DFF8E1" fill-opacity="0.8"/>
  <text x="400" y="334" font-family="sans-serif" font-size="10" font-weight="bold" fill="#20243C" text-anchor="middle">ROI</text>

  <!-- Control ROI (Unrelated region) -->
  <ellipse cx="310" cy="200" rx="30" ry="30" fill="#626A7C" fill-opacity="0.2" stroke="#A6C9E2" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="310" y="204" font-family="sans-serif" font-size="9" fill="#B9E0FC" text-anchor="middle">Control</text>

  <!-- Calibration Curve Graph -->
  <g transform="translate(520, 280)">
    <rect x="-10" y="-10" width="220" height="150" rx="8" fill="#20243C" stroke="#A3A7E0" stroke-width="1" opacity="0.9"/>
    <line x1="10" y1="120" x2="190" y2="120" stroke="#626A7C" stroke-width="1.5"/>
    <line x1="10" y1="120" x2="10" y2="10" stroke="#626A7C" stroke-width="1.5"/>
    <!-- Target Alpha 0.05 line -->
    <line x1="10" y1="90" x2="190" y2="90" stroke="#B9E0FC" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="195" y="93" font-family="sans-serif" font-size="9" fill="#B9E0FC">α=0.05</text>
    <!-- FPR Curve -->
    <path d="M 10 120 Q 50 115, 90 90 T 170 20" stroke="#A0A1F8" stroke-width="2.5" fill="none"/>
    <circle cx="90" cy="90" r="5" fill="#DFF8E1" stroke="#20243C" stroke-width="1.5"/>
    <text x="90" y="75" font-family="sans-serif" font-size="9" font-weight="bold" fill="#DFF8E1" text-anchor="middle">FPR = 0.047</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="310" height="42" rx="6" fill="#A0A1F8" fill-opacity="0.15" stroke="#A0A1F8" stroke-width="1"/>
    <text x="15" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FBFBFF">Reliable Normal Projection</text>
  </g>
</svg>
