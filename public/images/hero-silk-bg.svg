<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Lavender / Periwinkle Silk Gradient -->
    <linearGradient id="silkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECE6FC"/>
      <stop offset="30%" stop-color="#DDD4F8"/>
      <stop offset="60%" stop-color="#CBBCF0"/>
      <stop offset="85%" stop-color="#E1D7FA"/>
      <stop offset="100%" stop-color="#F2ECFE"/>
    </linearGradient>

    <!-- Edge-to-edge Horizontally Flowing Silk Wave Highlight (Rotated 90° left feel) -->
    <linearGradient id="waveLight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F5EFFF" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#DDD2F9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="waveLight2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#EDE5FE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Deep Satin Shadow Creases (Extending beyond all canvas boundaries) -->
    <linearGradient id="waveShadow1" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#8F78C6" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#7B65B5" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#9C87D3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6F5A9F" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="waveShadow2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7B64B2" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#9A87CF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#846EBB" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Edge-to-edge Silk Satin Blur -->
    <filter id="silkBlurHeavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
    <filter id="silkBlurMedium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="sheenGlowFine" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Full Canvas Edge-to-Edge Solid Background (No Inset) -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#silkBgGrad)"/>

  <!-- Fluid Horizontal Drape Waves spanning past the canvas boundaries to prevent box edges -->
  <!-- Top Drape Fold -->
  <path d="M-200,-200 C450,250 1350,-100 2120,150 L2120,650 C1450,400 550,700 -200,450 Z" fill="url(#waveLight1)" filter="url(#silkBlurHeavy)"/>

  <!-- Center Diagonal Crease Shadow -->
  <path d="M-200,150 C550,650 1250,200 2120,750 L2120,1280 C1350,950 550,1150 -200,980 Z" fill="url(#waveShadow1)" filter="url(#silkBlurHeavy)"/>

  <!-- Main Sheen Ribbon (Diagonal Flow Left to Right) -->
  <path d="M-200,300 C650,50 1450,850 2120,350 C1550,900 450,500 -200,800 Z" fill="url(#waveLight2)" filter="url(#silkBlurMedium)"/>

  <!-- Bottom Fold Shadow -->
  <path d="M-200,650 C450,950 1350,650 2120,1050 L2120,1280 L-200,1280 Z" fill="url(#waveShadow2)" filter="url(#silkBlurHeavy)"/>

  <!-- Fine Satin Specular Lines crossing edge-to-edge -->
  <path d="M-200,100 Q960,600 2120,150" stroke="#FFFFFF" stroke-width="120" opacity="0.65" filter="url(#sheenGlowFine)"/>
  <path d="M-200,450 Q960,100 2120,600" stroke="#FFFFFF" stroke-width="95" opacity="0.55" filter="url(#sheenGlowFine)"/>
  <path d="M-200,800 Q960,1050 2120,700" stroke="#FFFFFF" stroke-width="110" opacity="0.45" filter="url(#sheenGlowFine)"/>
</svg>
