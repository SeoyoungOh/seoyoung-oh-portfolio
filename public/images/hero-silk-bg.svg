<svg width="1000" height="1600" viewBox="0 0 1000 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Master Silk Color Palette -->
    <linearGradient id="silkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE6FC"/>
      <stop offset="30%" stop-color="#DCD4FA"/>
      <stop offset="65%" stop-color="#CBBFEF"/>
      <stop offset="100%" stop-color="#E5DEFC"/>
    </linearGradient>

    <!-- Top Left Satin Light Sweep -->
    <linearGradient id="satinGlowTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F5F0FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D1C4FA" stop-opacity="0"/>
    </linearGradient>

    <!-- Flowing Satin Fold Highlights -->
    <linearGradient id="ridgeGlow1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F2EBFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#DDD3F9" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="ridgeGlow2" x1="50%" y1="10%" x2="20%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#E9E2FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B8A9E8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Deep Satin Shadows -->
    <linearGradient id="shadowFold1" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#8F7CBF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#A997D6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6E5C9E" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="shadowFold2" x1="80%" y1="10%" x2="30%" y2="90%">
      <stop offset="0%" stop-color="#7B69AC" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#9C89CB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#BDB0E8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Blur Filters for Liquid Smooth Silk Surface -->
    <filter id="ultraSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="deepSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="sheenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Solid Base -->
  <rect width="1000" height="1600" fill="url(#silkBg)"/>

  <!-- Top Specular Satin Light Sweep -->
  <path d="M-100,-50 C300,50 600,100 1100,-50 L1100,600 C700,450 300,500 -100,300 Z" fill="url(#satinGlowTop)" filter="url(#ultraSoft)"/>

  <!-- Diagonal Vertical Silk Drapery Curves -->
  <!-- Left Main Drape Shadow -->
  <path d="M-50,-100 C300,300 200,800 650,1700 L-100,1700 Z" fill="url(#shadowFold1)" filter="url(#deepSoft)"/>

  <!-- Main Diagonal Highlight Ridge -->
  <path d="M50,-100 C450,400 350,950 850,1700 C700,1700 200,1000 -50,300 Z" fill="url(#ridgeGlow1)" filter="url(#ultraSoft)"/>

  <!-- Secondary Ripple Crease -->
  <path d="M300,-100 C650,500 450,1100 950,1700 C800,1700 350,900 150,-100 Z" fill="url(#shadowFold2)" filter="url(#deepSoft)"/>

  <!-- Bright Specular Reflection Band -->
  <path d="M150,-100 Q550,600 900,1500" stroke="#FFFFFF" stroke-width="65" opacity="0.7" filter="url(#sheenGlow)"/>
  <path d="M-50,200 Q350,850 750,1650" stroke="#FFFFFF" stroke-width="45" opacity="0.6" filter="url(#sheenGlow)"/>
  <path d="M400,-100 Q700,700 1050,1400" stroke="#FFFFFF" stroke-width="50" opacity="0.5" filter="url(#sheenGlow)"/>

  <!-- Ambient Satin Polish -->
  <rect width="1000" height="1600" fill="url(#satinGlowTop)" style="mix-blend-mode: soft-light;" opacity="0.8"/>
</svg>
