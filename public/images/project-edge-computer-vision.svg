<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#20243C"/>
  <g stroke="#A6C9E2" stroke-width="0.5" opacity="0.15">
    <path d="M0 50 H800 M0 150 H800 M0 250 H800 M0 350 H800 M0 450 H800"/>
    <path d="M100 0 V500 M250 0 V500 M400 0 V500 M550 0 V500 M700 0 V500"/>
  </g>

  <!-- Embedded Processor Board Schematic -->
  <rect x="180" y="100" width="440" height="300" rx="14" fill="#181A2D" stroke="#A6C9E2" stroke-width="2"/>
  <rect x="230" y="140" width="160" height="160" rx="8" fill="#20243C" stroke="#A0A1F8" stroke-width="2"/>
  <text x="310" y="210" font-family="sans-serif" font-size="14" font-weight="bold" fill="#A0A1F8" text-anchor="middle">ARM CPU RK3399</text>
  <text x="310" y="235" font-family="sans-serif" font-size="11" fill="#B9E0FC" text-anchor="middle">No GPU Acceleration</text>

  <!-- Metrics callout 1 -->
  <g transform="translate(430, 140)">
    <rect width="160" height="70" rx="6" fill="#DFF8E1" fill-opacity="0.15" stroke="#DFF8E1" stroke-width="1.5"/>
    <text x="15" y="28" font-family="sans-serif" font-size="11" fill="#C8DFCA">Segmentation mIoU</text>
    <text x="15" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#DFF8E1">+15.34%</text>
  </g>

  <!-- Metrics callout 2 -->
  <g transform="translate(430, 230)">
    <rect width="160" height="70" rx="6" fill="#A6C9E2" fill-opacity="0.15" stroke="#A6C9E2" stroke-width="1.5"/>
    <text x="15" y="28" font-family="sans-serif" font-size="11" fill="#A6C9E2">CPU Inference Latency</text>
    <text x="15" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#B9E0FC">1.78s / 150ms</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="310" height="42" rx="6" fill="#A0A1F8" fill-opacity="0.15" stroke="#A0A1F8" stroke-width="1"/>
    <text x="15" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FBFBFF">Edge Computer Vision (CPU-Only)</text>
  </g>
</svg>
