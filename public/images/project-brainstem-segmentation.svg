<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#20243C"/>
  <circle cx="400" cy="250" r="180" stroke="#9091DF" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="400" cy="250" r="120" stroke="#B6BAFA" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  
  <!-- U-Net Architecture Transfer Representation -->
  <g transform="translate(150, 160)">
    <path d="M0 0 L 80 160 L 160 0" stroke="#A0A1F8" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="8" fill="#A0A1F8"/>
    <circle cx="80" cy="160" r="10" fill="#DFF8E1"/>
    <circle cx="160" cy="0" r="8" fill="#B9E0FC"/>
    <text x="80" y="195" font-family="sans-serif" font-size="11" fill="#DFF8E1" text-anchor="middle">Pretrained Features</text>
  </g>

  <!-- Flow to Brainstem Target -->
  <path d="M 330 250 L 430 250" stroke="#A0A1F8" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Brainstem Target Segmentation Contour -->
  <g transform="translate(470, 150)">
    <rect width="200" height="200" rx="12" fill="#181A2D" stroke="#A6C9E2" stroke-width="1.5"/>
    <path d="M 100 40 C 60 70, 70 140, 100 170 C 130 140, 140 70, 100 40 Z" fill="#B6BAFA" fill-opacity="0.3" stroke="#B6BAFA" stroke-width="2"/>
    <text x="100" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FBFBFF" text-anchor="middle">Brainstem</text>
    <text x="100" y="130" font-family="sans-serif" font-size="10" fill="#DFF8E1" text-anchor="middle">ISBI 2024 Poster</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="310" height="42" rx="6" fill="#A0A1F8" fill-opacity="0.15" stroke="#A0A1F8" stroke-width="1"/>
    <text x="15" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FBFBFF">Brainstem Segmentation (Limited Data)</text>
  </g>
</svg>
